[book]
title = "Note Book"
description = "My personal knowledge base"
authors = ["Aniket Kakde"]
language = "en"
src = "src"

[rust]
edition = "2021"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
mathjax-support = true
git-repository-url = "https://github.com/ani2fun/note-book/tree/main"
additional-css = ["./mdbook-admonish.css", "theme/custom.css"]
additional-js = ["theme/mermaid-init.js"]

[output.html.playground]
editable = true
copyable = true
line-numbers = true

[output.html.code.hidelines]
python = "~"

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2

[preprocessor.admonish]
command = "mdbook-admonish"
optional = true
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`
